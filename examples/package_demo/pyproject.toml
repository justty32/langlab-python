[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "packet-lab-demo"
version = "0.1.0"
description = "Importable package example for the Modern Python tutorial"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
packet-lab = "packet_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/packet_lab"]
